name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validar título do PR
    permissions:
      pull-requests: read
    uses: eu-joao/devops/.github/workflows/ci-pr-title.yml@main

  commitlint:
    name: Validar mensagens de commit
    permissions:
      contents: read
    uses: eu-joao/devops/.github/workflows/ci-commitlint.yml@fix/commitlint-without-project-dependencies

  markdownlint:
    name: Validar Markdown
    permissions:
      contents: read
    uses: eu-joao/devops/.github/workflows/ci-markdownlint.yml@main
